name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_differential:
        description: Run the differential of the hashes against libcrypto (1,000,000 cases per algorithm, one to two hours)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  spec:
    name: Specs, published vectors, linkage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1
        with:
          crystal: 1.21.0
      - name: Install dependencies
        run: shards install --frozen --skip-postinstall --skip-executables
      - name: Check formatting
        run: crystal tool format --check src spec bench
      - name: Type-check the library
        run: crystal build --no-codegen src/beryl.cr
      - name: Type-check the benchmarks
        run: |
          crystal build --no-codegen bench/hashes_against_libcrypto.cr
          crystal build --no-codegen bench/ciphers_against_libcrypto.cr
      - name: Run the quick suite (unit specs and every published vector)
        run: crystal spec
      - name: Run the quick suite again on the portable code alone
        run: crystal spec -Dberyl_portable_hashes
      - name: Run the PBKDF2 vectors of 16,777,216 iterations
        run: crystal spec --release --tag slow
      - name: Prove the library links no OpenSSL
        run: |
          crystal build --release -Dwithout_openssl spec/probes/no_libcrypto.cr -o no_libcrypto
          ./no_libcrypto
          ldd no_libcrypto
          if ldd no_libcrypto | grep -E 'libssl|libcrypto'; then
            echo "the probe links OpenSSL"
            exit 1
          fi

  constant-time:
    name: Constant-time checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1
        with:
          crystal: 1.21.0
      - name: Install Valgrind at its pinned version
        run: |
          sudo apt-get update
          apt-cache policy valgrind
          sudo apt-get install -y --no-install-recommends valgrind=1:3.22.0-0ubuntu3
      - name: Install dependencies
        run: shards install --frozen --skip-postinstall --skip-executables
      - name: "Memory checker: no branch or address depends on a secret"
        run: |
          crystal build --release -Dgc_none -Dwithout_openssl spec/probes/secret_taint.cr -o secret_taint
          valgrind --error-exitcode=99 ./secret_taint
      - name: "Memory checker: a leaky comparison is caught"
        run: |
          set +e
          valgrind --error-exitcode=99 ./secret_taint leaky
          exit_status=$?
          set -e
          echo "exit status $exit_status (99 means the leak was reported)"
          test "$exit_status" -eq 99
      - name: "Compiled code: no branch or index depends on a secret"
        run: |
          crystal build --release --emit llvm-ir -Dwithout_openssl spec/probes/secret_flow.cr -o secret_flow
          ruby scripts/check_secret_flow.rb secret_flow.ll
      - name: "Compiled code, portable code alone: no branch or index depends on a secret"
        run: |
          crystal build --release --emit llvm-ir -Dwithout_openssl -Dberyl_portable_hashes spec/probes/secret_flow.cr -o secret_flow_portable
          ruby scripts/check_secret_flow.rb secret_flow_portable.ll
      - name: "Timing: HMAC and the ciphers take the same time whatever the secret"
        run: crystal spec --release --tag constant_time
        env:
          BERYL_CONSTANT_TIME_MEASUREMENTS: "1000000"

  aarch64:
    name: Linux on AArch64 (SHA instructions found at run time)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1
        with:
          crystal: 1.21.0
      - name: Install Valgrind at its pinned version
        run: |
          sudo apt-get update
          apt-cache policy valgrind
          sudo apt-get install -y --no-install-recommends valgrind=1:3.22.0-0ubuntu3
      - name: Install dependencies
        run: shards install --frozen --skip-postinstall --skip-executables
      - name: List the processor's hash instructions
        run: grep -m1 Features /proc/cpuinfo
      - name: Run the quick suite (unit specs and every published vector)
        run: crystal spec
      - name: Run the PBKDF2 vectors of 16,777,216 iterations
        run: crystal spec --release --tag slow
      - name: "Memory checker: no branch or address depends on a secret"
        run: |
          crystal build --release -Dgc_none -Dwithout_openssl spec/probes/secret_taint.cr -o secret_taint
          valgrind --error-exitcode=99 ./secret_taint
      - name: "Memory checker: a leaky comparison is caught"
        run: |
          set +e
          valgrind --error-exitcode=99 ./secret_taint leaky
          exit_status=$?
          set -e
          echo "exit status $exit_status (99 means the leak was reported)"
          test "$exit_status" -eq 99
      - name: "Compiled code: no branch or index depends on a secret"
        run: |
          crystal build --release --emit llvm-ir -Dwithout_openssl spec/probes/secret_flow.cr -o secret_flow
          ruby scripts/check_secret_flow.rb secret_flow.ll


  cipher-differential:
    name: Differential against libcrypto (ciphers)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1
        with:
          crystal: 1.21.0
      - name: Install dependencies
        run: shards install --frozen --skip-postinstall --skip-executables
      - name: Show the libcrypto this job compares against
        run: openssl version
      - name: Run the differential (1,000,000 cases per cipher)
        run: crystal spec --release --tag differential -e "cipher "


  differential:
    name: Differential against libcrypto, hashes and MACs (${{ matrix.code }} on ${{ matrix.runner }})
    if: github.event_name == 'workflow_dispatch' && inputs.run_differential
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            code: the code the processor selects
            flags: ""
          - runner: ubuntu-24.04
            code: portable code alone
            flags: "-Dberyl_portable_hashes"
          - runner: ubuntu-24.04-arm
            code: the code the processor selects
            flags: ""
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1
        with:
          crystal: 1.21.0
      - name: Install dependencies
        run: shards install --frozen --skip-postinstall --skip-executables
      - name: State which compression functions run
        run: crystal spec ${{ matrix.flags }} spec/beryl/crypto/processor_instructions_spec.cr -e "states which instructions"
      - name: Build the differential
        run: crystal build --release ${{ matrix.flags }} spec/differential/libcrypto_differential_spec.cr -o differential_spec
      # The spec runner keeps only the last -e it is given, so each family
      # is its own run.
      - name: Run the differential on the hashes (1,000,000 cases each)
        run: ./differential_spec --tag differential -e "hash "
      - name: Run the differential on HMAC (1,000,000 cases each)
        run: ./differential_spec --tag differential -e "HMAC-"
      - name: Run the differential on HKDF (100,000 cases each)
        run: ./differential_spec --tag differential -e "HKDF-"
      - name: Run the differential on PBKDF2 (10,000 cases each)
        run: ./differential_spec --tag differential -e "PBKDF2-"
