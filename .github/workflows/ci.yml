name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_differential:
        description: Run the differential of the hashes against libcrypto (1,000,000 cases per algorithm, one to two hours)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  spec:
    name: Specs, published vectors, linkage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1
        with:
          crystal: 1.21.0
      - name: Install dependencies
        run: shards install --frozen --skip-postinstall --skip-executables
      - name: Fetch the published vectors kept out of git (checked by sha256)
        run: ruby scripts/fetch_vectors.rb --missing
      - name: Check formatting
        run: crystal tool format --check src spec bench
      - name: Check that the field arithmetic is what fiat-crypto's pinned output translates to
        run: CRYSTAL=crystal ruby scripts/generate_field_arithmetic.rb --check
      - name: Type-check the library
        run: crystal build --no-codegen src/beryl.cr
      - name: Type-check the benchmarks
        run: |
          crystal build --no-codegen bench/hashes_against_libcrypto.cr
          crystal build --no-codegen bench/ciphers_against_libcrypto.cr
          crystal build --no-codegen bench/rsa_against_libcrypto.cr
          crystal build --no-codegen bench/public_key_against_libcrypto.cr
          crystal build --no-codegen bench/certificates_against_libcrypto.cr
      - name: Type-check the certificate differential and the DER fuzzer
        run: |
          crystal build --no-codegen spec/differential/libcrypto_certificate_differential.cr
          crystal build --no-codegen spec/fuzz/der_parser_fuzz.cr
      - name: Type-check the TLS examples, the handshake fuzzer and the BoGo shim
        run: |
          crystal build --no-codegen spec/fuzz/tls_handshake_fuzz.cr
          crystal build --no-codegen spec/bogo/beryl_bogo_shim.cr
          crystal build --no-codegen -Dwithout_openssl examples/https_server.cr
          crystal build --no-codegen -Dwithout_openssl examples/https_client.cr
      - name: Run the quick suite (unit specs and every published vector)
        run: crystal spec
      - name: Run the quick suite again on the portable code alone
        run: crystal spec -Dberyl_portable_hashes
      - name: Run the quick suite again on the portable ciphers alone
        run: crystal spec -Dberyl_portable_ciphers
      - name: Run the quick suite again on the curves' fiat-crypto field arithmetic alone (no assembly)
        run: crystal spec -Dberyl_portable_curves
      - name: State the x86-64 vector and multiply instructions this runner has
        run: |
          lscpu | sed -n 's/^Model name:[[:space:]]*//p'
          grep -m1 -o -w -E 'avx2|avx512f|avx512vl|avx512bw|avx512dq|avx512ifma|vaes|vpclmulqdq|bmi2|adx' /proc/cpuinfo | sort -u | tr '\n' ' '; echo
      - name: Run the cipher, hash and public-key vectors again without AVX-512 (AVX2 paths)
        run: crystal spec -Dberyl_without_avx512 spec/beryl/crypto
      - name: Run the cipher, hash and public-key vectors again without AVX2 or AVX-512 (SSE paths)
        run: crystal spec -Dberyl_without_avx2 spec/beryl/crypto
      - name: Run the public-key vectors again without MULX and ADX
        run: crystal spec -Dberyl_without_mulx spec/beryl/crypto
      - name: Run the slow vectors (PBKDF2 at 16,777,216 iterations, X25519 iterated 1,000,000 times)
        run: crystal spec --release --tag slow
      - name: "Field arithmetic: every translated function and every one in assembly equals fiat-crypto's C (1,000,000 inputs each)"
        run: |
          cc -O2 -c spec/field_arithmetic/fiat_crypto_c_shim.c -o spec/field_arithmetic/fiat_crypto_c_shim.o
          crystal build --release spec/field_arithmetic/fiat_crypto_equality.cr -o fiat_crypto_equality
          ./fiat_crypto_equality 1000000 "${{ github.run_id }}"
      - name: Prove the library links no OpenSSL
        run: |
          crystal build --release -Dwithout_openssl spec/probes/no_libcrypto.cr -o no_libcrypto
          ./no_libcrypto
          ldd no_libcrypto
          if ldd no_libcrypto | grep -E 'libssl|libcrypto'; then
            echo "the probe links OpenSSL"
            exit 1
          fi
      - name: Prove the TLS example server and client link no OpenSSL
        run: |
          crystal build --release -Dwithout_openssl examples/https_server.cr -o https_server
          crystal build --release -Dwithout_openssl examples/https_client.cr -o https_client
          ldd https_server https_client
          if ldd https_server https_client | grep -E 'libssl|libcrypto'; then
            echo "a TLS example links OpenSSL"
            exit 1
          fi

  constant-time:
    name: Constant-time checks
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: State the processor the timing runs on
        run: |
          lscpu
          grep -m1 microcode /proc/cpuinfo
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1
        with:
          crystal: 1.21.0
      - name: Install Valgrind at its pinned version
        run: |
          sudo apt-get update
          apt-cache policy valgrind
          sudo apt-get install -y --no-install-recommends valgrind=1:3.22.0-0ubuntu3
      - name: Install dependencies
        run: shards install --frozen --skip-postinstall --skip-executables
      - name: Fetch the published vectors kept out of git (checked by sha256)
        run: ruby scripts/fetch_vectors.rb --missing
      - name: "Memory checker: no branch or address depends on a secret"
        run: |
          crystal build --release -Dgc_none -Dwithout_openssl -Dberyl_without_data_independent_timing spec/probes/secret_taint.cr -o secret_taint
          valgrind --error-exitcode=99 ./secret_taint
      - name: "Memory checker: a leaky comparison is caught"
        run: |
          set +e
          valgrind --error-exitcode=99 ./secret_taint leaky
          exit_status=$?
          set -e
          echo "exit status $exit_status (99 means the leak was reported)"
          test "$exit_status" -eq 99
      - name: "Compiled code: no branch or index depends on a secret"
        run: |
          crystal build --release --emit llvm-ir -Dwithout_openssl spec/probes/secret_flow.cr -o secret_flow
          ruby scripts/check_secret_flow.rb secret_flow.ll
      - name: "Compiled code, portable code alone: no branch or index depends on a secret"
        run: |
          crystal build --release --emit llvm-ir -Dwithout_openssl -Dberyl_portable_hashes spec/probes/secret_flow.cr -o secret_flow_portable
          ruby scripts/check_secret_flow.rb secret_flow_portable.ll
      - name: "Compiled code, portable ciphers alone: no branch or index depends on a secret"
        run: |
          crystal build --release --emit llvm-ir -Dwithout_openssl -Dberyl_portable_ciphers spec/probes/secret_flow.cr -o secret_flow_portable_ciphers
          ruby scripts/check_secret_flow.rb secret_flow_portable_ciphers.ll
      # Built first, then run pinned to one processor so the measurements are
      # not moved between cores. Each check is decided by two runs out of
      # three (spec/support/timing_leak_measurement.cr).
      - name: "Timing: HMAC, the ciphers and the curve operations take the same time whatever the secret"
        run: |
          crystal build --release spec/constant_time/hmac_timing_spec.cr spec/constant_time/cipher_timing_spec.cr spec/constant_time/public_key_timing_spec.cr -o constant_time_specs
          taskset -c 1 ./constant_time_specs --tag constant_time
        env:
          BERYL_CONSTANT_TIME_MEASUREMENTS: "1000000"
          BERYL_PUBLIC_KEY_CONSTANT_TIME_MEASUREMENTS: "100000"

  aarch64:
    name: Linux on AArch64 (hash and cipher instructions found at run time)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1
        with:
          crystal: 1.21.0
      - name: Install Valgrind at its pinned version
        run: |
          sudo apt-get update
          apt-cache policy valgrind
          sudo apt-get install -y --no-install-recommends valgrind=1:3.22.0-0ubuntu3
      - name: Install dependencies
        run: shards install --frozen --skip-postinstall --skip-executables
      - name: Fetch the published vectors kept out of git (checked by sha256)
        run: ruby scripts/fetch_vectors.rb --missing
      - name: List the processor's hash and cipher instructions
        run: grep -m1 Features /proc/cpuinfo
      - name: Run the quick suite (unit specs and every published vector)
        run: crystal spec
      - name: Run the cipher vectors again on the code written without eor3
        run: crystal spec -Dberyl_without_eor3 spec/beryl/crypto
      - name: Run the public-key suite again without assembly (fiat-crypto field arithmetic, RSA multiplication in Crystal)
        run: crystal spec -Dberyl_portable_curves -Dberyl_portable_rsa spec/beryl/crypto
      - name: Run the slow vectors (PBKDF2 at 16,777,216 iterations, X25519 iterated 1,000,000 times)
        run: crystal spec --release --tag slow
      - name: "Field arithmetic: every translated function and every one in assembly equals fiat-crypto's C (1,000,000 inputs each)"
        run: |
          cc -O2 -c spec/field_arithmetic/fiat_crypto_c_shim.c -o spec/field_arithmetic/fiat_crypto_c_shim.o
          crystal build --release spec/field_arithmetic/fiat_crypto_equality.cr -o fiat_crypto_equality
          ./fiat_crypto_equality 1000000 "${{ github.run_id }}"
      - name: "Memory checker: no branch or address depends on a secret"
        run: |
          crystal build --release -Dgc_none -Dwithout_openssl -Dberyl_without_data_independent_timing spec/probes/secret_taint.cr -o secret_taint
          valgrind --error-exitcode=99 ./secret_taint
      - name: "Memory checker: a leaky comparison is caught"
        run: |
          set +e
          valgrind --error-exitcode=99 ./secret_taint leaky
          exit_status=$?
          set -e
          echo "exit status $exit_status (99 means the leak was reported)"
          test "$exit_status" -eq 99
      - name: "Compiled code: no branch or index depends on a secret"
        run: |
          crystal build --release --emit llvm-ir -Dwithout_openssl spec/probes/secret_flow.cr -o secret_flow
          ruby scripts/check_secret_flow.rb secret_flow.ll
      - name: "Compiled code, written without eor3: no branch or index depends on a secret"
        run: |
          crystal build --release --emit llvm-ir -Dwithout_openssl -Dberyl_without_eor3 spec/probes/secret_flow.cr -o secret_flow_without_eor3
          ruby scripts/check_secret_flow.rb secret_flow_without_eor3.ll

  rsa-constant-time:
    name: Constant-time timing check, RSA (${{ matrix.examples }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # One job per key size: the 4,096-bit private operation alone took about
    # 13 minutes per run at 50,000 measurements per class on an x86-64
    # runner, and a check takes two runs (three when they disagree).
    strategy:
      fail-fast: false
      matrix:
        examples: ["(2048 bits)", "(3072 bits)", "(4096 bits)", "OAEP"]
    steps:
      - name: State the processor the timing runs on
        run: |
          lscpu
          grep -m1 microcode /proc/cpuinfo
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1
        with:
          crystal: 1.21.0
      - name: Install dependencies
        run: shards install --frozen --skip-postinstall --skip-executables
      - name: Install the published vectors kept out of git (checked by sha256)
        run: ruby scripts/fetch_vectors.rb --missing
      # The private operation takes about a millisecond, so this runs at a
      # smaller count than the other timing checks (200,000 per class is the
      # count recorded for each pull request on the build Mac).
      - name: "Timing: the RSA private operation and OAEP decoding take the same time whatever the secret"
        run: |
          crystal build --release spec/constant_time/rsa_timing_spec.cr -o rsa_timing_specs
          taskset -c 1 ./rsa_timing_specs --tag rsa_constant_time --example "${{ matrix.examples }}"
        env:
          BERYL_CONSTANT_TIME_MEASUREMENTS: "50000"

  rsa-differential:
    name: Differential against libcrypto, RSA (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1
        with:
          crystal: 1.21.0
      - name: Install dependencies
        run: shards install --frozen --skip-postinstall --skip-executables
      - name: Show the libcrypto this job compares against
        run: openssl version
      - name: Build the differential
        run: crystal build --release spec/differential/libcrypto_rsa_differential_spec.cr -o rsa_differential_spec
      # One process per scheme and size; 20,000, 5,000 and 2,000 cases at
      # 2,048, 3,072 and 4,096 bits.
      - name: Run the differential on RSA-2048 (20,000 cases per scheme)
        run: |
          ./rsa_differential_spec --tag differential -e "RSA-2048 PKCS#1 v1.5 matches"
          ./rsa_differential_spec --tag differential -e "RSA-2048 PSS matches"
          ./rsa_differential_spec --tag differential -e "RSA-2048 OAEP matches"
      - name: Run the differential on RSA-3072 (5,000 cases per scheme)
        run: |
          ./rsa_differential_spec --tag differential -e "RSA-3072 PKCS#1 v1.5 matches"
          ./rsa_differential_spec --tag differential -e "RSA-3072 PSS matches"
          ./rsa_differential_spec --tag differential -e "RSA-3072 OAEP matches"
      - name: Run the differential on RSA-4096 (2,000 cases per scheme)
        run: |
          ./rsa_differential_spec --tag differential -e "RSA-4096 PKCS#1 v1.5 matches"
          ./rsa_differential_spec --tag differential -e "RSA-4096 PSS matches"
          ./rsa_differential_spec --tag differential -e "RSA-4096 OAEP matches"


  cipher-differential:
    name: Differential against libcrypto, ciphers (${{ matrix.code }} on ${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            code: the code the processor selects
            flags: ""
          - runner: ubuntu-24.04
            code: portable ciphers alone
            flags: "-Dberyl_portable_ciphers"
          - runner: ubuntu-24.04-arm
            code: the code the processor selects
            flags: ""
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1
        with:
          crystal: 1.21.0
      - name: Install dependencies
        run: shards install --frozen --skip-postinstall --skip-executables
      - name: Show the libcrypto this job compares against
        run: openssl version
      - name: State which cipher instructions run
        run: crystal spec ${{ matrix.flags }} spec/beryl/crypto/processor_cipher_instructions_spec.cr -e "states which instructions"
      - name: Run the differential (1,000,000 cases per cipher)
        run: crystal spec --release ${{ matrix.flags }} --tag differential -e "cipher "

  curve-differential:
    name: Differential against libcrypto, curves (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1
        with:
          crystal: 1.21.0
      - name: Install dependencies
        run: shards install --frozen --skip-postinstall --skip-executables
      - name: Fetch the published vectors kept out of git (checked by sha256)
        run: ruby scripts/fetch_vectors.rb --missing
      - name: Show the libcrypto this job compares against
        run: openssl version
      - name: Build the differential
        run: crystal build --release spec/differential/libcrypto_curve_differential_spec.cr -o curve_differential_spec
      - name: Run the differential (X25519 1,000,000 cases, the others 200,000, every Wycheproof case)
        run: ./curve_differential_spec --tag differential -e "curve "

  certificates:
    name: Certificates against libcrypto, and the DER fuzzer
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1
        with:
          crystal: 1.21.0
      - name: Install dependencies
        run: shards install --frozen --skip-postinstall --skip-executables
      - name: Fetch the published vectors kept out of git (checked by sha256)
        run: ruby scripts/fetch_vectors.rb --missing
      - name: Fetch the Certificate Transparency corpus (40,960 log entries, checked by sha256)
        run: ruby scripts/fetch_certificate_corpus.rb
      - name: Show the libcrypto this job compares against
        run: openssl version
      - name: Build the differential and the fuzzer
        run: |
          crystal build --release spec/differential/libcrypto_certificate_differential.cr -o certificate_differential
          crystal build --release spec/fuzz/der_parser_fuzz.cr -o der_parser_fuzz
      - name: "Differential: every corpus certificate read as libcrypto reads it"
        run: ./certificate_differential parse
      - name: "Differential: every logged chain verified as libcrypto verifies it"
        run: ./certificate_differential verify
      - name: "Differential: 200,000 mutated certificates, no crash and no slow reading"
        run: ./certificate_differential mutate 200000 "${{ github.run_id }}"
      - name: "Fuzz: 1,000,000 mutated inputs through every reader, no finding"
        run: ./der_parser_fuzz 1000000 "${{ github.run_id }}" spec/vectors/x509-limbo/limbo.json

  tls-fuzz:
    name: TLS handshake fuzzer
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1
        with:
          crystal: 1.21.0
      - name: Install dependencies
        run: shards install --frozen --skip-postinstall --skip-executables
      - name: Build the fuzzer
        run: crystal build --release spec/fuzz/tls_handshake_fuzz.cr -o tls_handshake_fuzz
      - name: "Fuzz: 200,000 mutated handshakes through every parser and both state machines, no finding"
        run: ./tls_handshake_fuzz 200000 "${{ github.run_id }}"

  tls-interop:
    name: TLS against OpenSSL, curl and Go (pinned and checked by sha256)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1
        with:
          crystal: 1.21.0
      - name: Install dependencies
        run: shards install --frozen --skip-postinstall --skip-executables
      - name: Build OpenSSL 4.1.0 and curl 8.23.0, unpack Go 1.27.4 (scripts/interop/TOOLS.md)
        run: ruby scripts/interop/install_tools.rb "$RUNNER_TEMP/interop-tools"
      - name: "Interop: every cell of the matrix completes its handshake and exchange"
        run: ruby scripts/interop/run_matrix.rb "$RUNNER_TEMP/interop-tools" --crystal crystal

  tls-bogo:
    name: TLS against BoringSSL's test suite, BoGo (pinned commit)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1
        with:
          crystal: 1.21.0
      - name: Install dependencies
        run: shards install --frozen --skip-postinstall --skip-executables
      - name: "BoGo: every enabled test passes; each disabled one has its reason in spec/bogo/config.json"
        run: ruby scripts/bogo/run_bogo.rb "$RUNNER_TEMP/bogo" --crystal crystal

  tls-tlsfuzzer:
    name: TLS against tlsfuzzer's TLS 1.3 scripts (pinned commits)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1
        with:
          crystal: 1.21.0
      - name: Install dependencies
        run: shards install --frozen --skip-postinstall --skip-executables
      - name: "tlsfuzzer: every failure is one scripts/tlsfuzzer/config.json expects, with its reason"
        run: ruby scripts/tlsfuzzer/run_tlsfuzzer.rb "$RUNNER_TEMP/tlsfuzzer" --crystal crystal --python python3

  differential:
    name: Differential against libcrypto, hashes and MACs (${{ matrix.code }} on ${{ matrix.runner }})
    if: github.event_name == 'workflow_dispatch' && inputs.run_differential
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            code: the code the processor selects
            flags: ""
          - runner: ubuntu-24.04
            code: portable code alone
            flags: "-Dberyl_portable_hashes"
          - runner: ubuntu-24.04-arm
            code: the code the processor selects
            flags: ""
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1
        with:
          crystal: 1.21.0
      - name: Install dependencies
        run: shards install --frozen --skip-postinstall --skip-executables
      - name: State which compression functions run
        run: crystal spec ${{ matrix.flags }} spec/beryl/crypto/processor_instructions_spec.cr -e "states which instructions"
      - name: Build the differential
        run: crystal build --release ${{ matrix.flags }} spec/differential/libcrypto_differential_spec.cr -o differential_spec
      # The spec runner keeps only the last -e it is given, so each family
      # is its own run.
      - name: Run the differential on the hashes (1,000,000 cases each)
        run: ./differential_spec --tag differential -e "hash "
      - name: Run the differential on HMAC (1,000,000 cases each)
        run: ./differential_spec --tag differential -e "HMAC-"
      - name: Run the differential on HKDF (100,000 cases each)
        run: ./differential_spec --tag differential -e "HKDF-"
      - name: Run the differential on PBKDF2 (10,000 cases each)
        run: ./differential_spec --tag differential -e "PBKDF2-"
